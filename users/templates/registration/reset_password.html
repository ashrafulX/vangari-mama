{% extends "base.html" %}
{% load static %}

{% block title %}Password Changed Successfully | Vangari Mama{% endblock title %}

{% block content %}
<!-- 
    Visual style note: Glassmorphism design, rounded corners, un-pulsing central icon,
    and emerald green highlights (#10b981) for success.
-->

<div class="min-h-[85vh] flex items-center justify-center bg-white relative isolate overflow-hidden py-12 px-4 sm:px-6 lg:px-8">
    
    <!-- Ultra-Modern Background Elements -->
    <div class="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-green-100/50 via-slate-50 to-slate-50"></div>
    <!-- Soft diffused green light blobs -->
    <div class="absolute top-20 left-20 -z-10 h-72 w-72 animate-pulse rounded-full bg-green-400/20 blur-[80px]"></div>
    <div class="absolute bottom-10 right-20 -z-10 h-80 w-80 rounded-full bg-emerald-300/20 blur-[100px]"></div>

    <!-- Centered Glass Card for Success Message -->
    <div class="max-w-xl w-full bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col items-center p-12 text-center border border-slate-100 ring-1 ring-gray-900/5 transition-all duration-300 hover:shadow-[#14532D]/5">
        
        <!-- Success Icon Composition -->
        <div class="relative flex h-36 w-36 items-center justify-center rounded-full mb-10 transition-transform hover:scale-105 duration-300">
            <!-- Inner thick green band -->
            <div class="absolute inset-0 rounded-full border-[12px] border-emerald-500 shadow-inner"></div>
            <!-- Outer arrow-forming border -->
            <div class="absolute -inset-1.5 rounded-full border-4 border-emerald-500 opacity-60"></div>
            <!-- White Checkmark Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="relative z-10 w-16 h-16 text-white">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
        </div>
        
        <!-- Heading text -->
        <h1 class="text-4xl font-extrabold text-slate-950 tracking-tighter mb-4">Password Changed Successfully</h1>
        
        <!-- Paragraph text -->
        <p class="text-lg leading-relaxed text-slate-600 mb-10 max-w-sm mx-auto">Please Back to</p>

        <!-- Primary CTA Button -->
        <div class="mt-2 w-full max-w-sm mx-auto">
            <!-- তোমার রিকোয়েস্ট অনুযায়ী লিংকটি 'Dashboard' এ দেওয়া হলো -->
            <a href="{% url '#' %}" class="group relative flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-600 px-8 py-4 text-base font-bold text-white shadow-[0_0_20px_rgba(5,150,105,0.4)] transition-all hover:-translate-y-1 hover:bg-emerald-700 hover:shadow-[0_0_30px_rgba(5,150,105,0.6)] overflow-hidden focus:ring-4 focus:ring-emerald-200 outline-none">
                <span class="absolute inset-0 bg-white/10 translate-y-full transition-transform group-hover:translate-y-0 ease-out duration-300"></span>
                <span class="relative flex items-center gap-2">
                    Dashboard
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="h-5 w-5 transition-transform group-hover:translate-x-1">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                    </svg>
                </span>
            </a>
        </div>

        <div class="mt-8 text-center">
            <a href="{% url 'home' %}" class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-[#14532D] transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
                Go to Home
            </a>
        </div>
        
    </div>
</div>
{% endblock content %}
